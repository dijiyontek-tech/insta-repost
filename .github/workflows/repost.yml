name: Instagram Reels Remix & Repost

on:
  # ÖNEMLİ: GitHub'ın kendi "schedule" tetikleyicisi bilerek KULLANILMIYOR.
  # GitHub'ın kendi dokümantasyonu, yoğunluk zamanlarında zamanlanmış
  # tetiklemelerin saatlerce gecikebildiğini hatta hiç tetiklenmeyebildiğini
  # belirtiyor — gerçekten de bazı günler gece yarısı tetiklendi, bazı günler
  # (27 Ağustos, 1 Eylül) hiç tetiklenmedi. Dakika kaydırmak da yetmedi.
  # Bunun yerine, dış bir zamanlayıcı servisi (cron-job.org) günde birçok kez
  # (ör. her 30-45 dakikada bir) GitHub API'sinin workflow_dispatch uç
  # noktasını "posts_per_run": "auto" ile çağırıyor — script günün ilk
  # çağrısında o gün kaç video (4-6) paylaşılacağını ve saatlerini rastgele
  # planlıyor, sonraki çağrılarda saati gelen slot için tek video paylaşıyor
  # (bkz. _decide_auto_batch_size). Saatler her gün farklı çıkıyor.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu: videoyu işleyip Supabase'e yükler ama Instagram'a paylaşmaz"
        type: boolean
        default: true
      media_selection:
        description: "Hangi video seçilsin"
        type: choice
        options:
          - top_viewed_cycle
          - random
          - most_liked
        default: top_viewed_cycle
      reset_cycle:
        description: "Bakım: tur takibini sıfırla (video seçmez, paylaşım yapmaz)"
        type: boolean
        default: false
      sync_library:
        description: "Bakım: hesaptaki tüm videoları kütüphaneye (GitHub release) indir, paylaşım yapmaz"
        type: boolean
        default: false
      target_media_id:
        description: "Teşhis: belirli bir medya ID'sini ham veri + izlenme sayısıyla logla"
        type: string
        default: ""
      posts_per_run:
        description: "Bu çalıştırmada kaç video paylaşılsın"
        type: string
        default: "1"

jobs:
  repost:
    runs-on: ubuntu-latest
    # Video kütüphanesi bu reponun "video-library" release'inde tutuluyor;
    # dosya ekleyebilmek için yazma izni gerekiyor.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Headless tarayıcı kur (media_url eksik videolar için yedek indirme)
        run: playwright install --with-deps chromium

      - name: Repost script'ini çalıştır
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: insta-repost
          GITHUB_TOKEN: ${{ github.token }}
          CAPTION_SUFFIX: ${{ vars.CAPTION_SUFFIX }}
          MAX_REPOSTS_PER_VIDEO: "1"
          # Günlük hedef script içinde her gün rastgele 4-6 seçiliyor
          # (DAILY_TARGET_RANGE); bu, elle tetiklemeler dahil asla
          # aşılmayacak SERT tavan. (Eskiden ~25/gün paylaşıyorduk, Instagram
          # "otomatik davranış" uyarısı verdi.)
          DAILY_PUBLISH_LIMIT: "6"
          DRY_RUN: ${{ inputs.dry_run }}
          MEDIA_SELECTION: ${{ inputs.media_selection || 'top_viewed_cycle' }}
          MIN_VIEW_COUNT: "0"
          RESET_CYCLE: ${{ inputs.reset_cycle || 'false' }}
          TARGET_MEDIA_ID: ${{ inputs.target_media_id || '' }}
          SYNC_LIBRARY: ${{ inputs.sync_library || 'false' }}
          # Dış zamanlayıcının çağrılarında "auto" gönderilir (script kendi
          # kendine karar verir); elle test ederken varsayılan "1"dir,
          # istenirse sabit bir sayı da girilebilir.
          POSTS_PER_RUN: ${{ inputs.posts_per_run }}
          # Bu proje kasıtlı olarak HER ZAMAN Deneme Reels olarak paylaşır,
          # normal paylaşım hiç yapılmaz (özgün olmayan içerik Instagram'da
          # bastırılıyor, deneme modu bunu aşmanın yolu).
          TRIAL_REEL: "true"
        run: python scripts/repost.py
