name: Instagram Reels Remix & Repost

on:
  schedule:
    # 07:00 UTC ≈ 10:00 Türkiye saati (TR yıl boyunca UTC+3). Değiştirmek için crontab.guru kullanabilirsin.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu: videoyu işleyip Supabase'e yükler ama Instagram'a paylaşmaz"
        type: boolean
        default: true

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg kur (statik binary, apt mirror'larına bağımlı değil)
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg

      - name: Font indir (apt yerine doğrudan indirme, mirror'lara bağımlı değil)
        run: curl -fsSL -o /tmp/DejaVuSans-Bold.ttf https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/ttf/DejaVuSans-Bold.ttf

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Repost script'ini çalıştır
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: insta-repost
          CAPTION_SUFFIX: ${{ vars.CAPTION_SUFFIX }}
          MAX_REPOSTS_PER_VIDEO: "1"
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || inputs.dry_run }}
          FONT_PATH: /tmp/DejaVuSans-Bold.ttf
        run: python scripts/repost.py
